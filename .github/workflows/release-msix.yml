name: Build & Release MSIX

# Builds a signed, sideloadable MSIX package so the app can be installed on
# laptops without the Microsoft Store. When a release is published the packages
# (and the public signing certificate) are attached to that release.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Generate self-signed signing certificate
        id: cert
        shell: pwsh
        run: |
          $subject = 'CN=gungaretti'   # must match Package.appxmanifest Identity/Publisher
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $subject `
            -KeyUsage DigitalSignature `
            -FriendlyName 'PowerModeSlider Sideload' `
            -CertStoreLocation 'Cert:\CurrentUser\My' `
            -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          $password = "pms-${{ github.run_id }}"
          $secure = ConvertTo-SecureString -String $password -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
          Export-Certificate -Cert $cert -FilePath (Join-Path $env:RUNNER_TEMP 'PowerModeSlider.cer') | Out-Null
          "pfx=$pfx"            | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "password=$password"  | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore PowerModeSlider/PowerModeSlider.csproj -r win-${{ matrix.platform }}

      - name: Build signed MSIX
        shell: pwsh
        run: |
          msbuild PowerModeSlider/PowerModeSlider.csproj `
            /restore `
            /p:Configuration=Release `
            /p:Platform=${{ matrix.platform }} `
            /p:RuntimeIdentifier=win-${{ matrix.platform }} `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=true `
            /p:PackageCertificateThumbprint= `
            /p:PackageCertificateKeyFile="${{ steps.cert.outputs.pfx }}" `
            /p:PackageCertificatePassword="${{ steps.cert.outputs.password }}"

      - name: Stage artifacts
        id: stage
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "artifacts-${{ matrix.platform }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $packages = Get-ChildItem -Path PowerModeSlider -Recurse -Include *.msix,*.msixbundle -ErrorAction SilentlyContinue
          if (-not $packages) { throw 'No MSIX package was produced.' }
          $packages | ForEach-Object { Copy-Item $_.FullName -Destination $out -Force }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'PowerModeSlider.cer') -Destination $out -Force
          Copy-Item 'scripts/Install-PowerModeSlider.ps1' -Destination $out -Force
          Get-ChildItem $out | ForEach-Object { Write-Host $_.Name }
          "dir=$out" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PowerModeSlider-${{ matrix.platform }}
          path: ${{ steps.stage.outputs.dir }}/*

      - name: Attach packages to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem '${{ steps.stage.outputs.dir }}' | ForEach-Object { $_.FullName }
          gh release upload '${{ github.event.release.tag_name }}' $files --clobber
